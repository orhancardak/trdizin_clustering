services:
  postgres:
    image: postgres:16
    container_name: trdizin_clustering_postgres

    environment:
      POSTGRES_DB: trdizin_clustering_db
      # Yerel geliştirme varsayılanları; üretimde .env ile geçersiz kılınabilir.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5434:5432"

    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data  

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: trdizin_qdrant
  
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: always

  app:
    build: .
    container_name: trdizin_clustering_app
    working_dir: /app

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trdizin_clustering_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_DIR: /app/embeddings
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-local-upload-token}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      

    ports:
      - "5001:5001"

    volumes:
      - .:/app
      # Projenin 2B UMAP CSV'sini ve üretim embeddinglerini gizlemeyin.
      # Yalnızca kullanıcı yüklemeleri için ayrılmış alt dizini kalıcılaştırın.
      - ./data/app_embeddings:/app/embeddings/incoming

    

    command: python dashboard/app.py

  caddy:
    image: caddy:latest
    container_name: trdizin_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy/data:/data      
      - ./data/caddy/config:/config  
